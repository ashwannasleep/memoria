    <rect x="500" y="210" width="260" height="150" rx="20" />
    <rect x="810" y="150" width="240" height="130" rx="20" />
  </g>
  <circle cx="750" cy="360" r="16" fill="url(#accent)" />
  <circle cx="470" cy="300" r="12" fill="url(#accent)" />
  <text x="150" y="470" fill="#2f2a22" font-family="Georgia, serif" font-size="78" font-weight="700">Memoria</text>
  <text x="150" y="530" fill="#655742" font-family="Inter, Arial, sans-serif" font-size="34">Remember everything you read.</text>
