<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge retention visualization</title>
  <desc id="desc">An abstract illustration of connected ideas and memory nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6efe3" />
      <stop offset="100%" stop-color="#e9ddc9" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)" />

  <g opacity="0.35">
    <circle cx="180" cy="160" r="120" fill="#ffffff" />
    <circle cx="1000" cy="140" r="95" fill="#ffffff" />
    <circle cx="1090" cy="720" r="140" fill="#ffffff" />
    <circle cx="160" cy="760" r="100" fill="#ffffff" />
  </g>

  <g stroke="#b39b77" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.42">
    <path d="M170 520 C290 430, 420 430, 540 520" />
    <path d="M520 510 C640 420, 760 420, 870 500" />
    <path d="M220 340 C360 280, 460 300, 620 350" />
    <path d="M620 350 C760 390, 860 360, 990 280" />
    <path d="M350 680 C520 620, 710 640, 910 700" />
  </g>

  <g filter="url(#shadow)">
    <rect x="180" y="180" width="270" height="160" rx="22" fill="#fffaf1" stroke="#e5d4b5" stroke-width="4" />
    <rect x="505" y="235" width="250" height="145" rx="22" fill="#fffaf1" stroke="#e5d4b5" stroke-width="4" />
    <rect x="810" y="170" width="210" height="125" rx="22" fill="#fffaf1" stroke="#e5d4b5" stroke-width="4" />
    <rect x="250" y="520" width="250" height="150" rx="22" fill="#fffaf1" stroke="#e5d4b5" stroke-width="4" />
    <rect x="560" y="560" width="300" height="160" rx="22" fill="#fffaf1" stroke="#e5d4b5" stroke-width="4" />
  </g>

  <g fill="#7b5f35" font-family="Georgia, serif" font-size="36" font-weight="700">
    <text x="225" y="270">Capture</text>
    <text x="540" y="315">Review</text>
    <text x="840" y="245">Recall</text>
    <text x="305" y="605">Connect</text>
    <text x="610" y="645">Retain</text>
  </g>

  <g>
    <circle cx="500" cy="500" r="18" fill="url(#accent)" />
    <circle cx="740" cy="470" r="14" fill="url(#accent)" />
    <circle cx="420" cy="395" r="12" fill="url(#accent)" />
    <circle cx="660" cy="700" r="14" fill="url(#accent)" />
    <circle cx="860" cy="560" r="12" fill="url(#accent)" />
  </g>
</svg>
