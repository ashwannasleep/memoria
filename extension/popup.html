<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memoria Web Clipper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Memoria Clipper</h1>
      <p class="subtitle">Save highlighted text from any page into your Memoria app.</p>

      <form id="settings-form">
        <label for="memoria-base-url">Memoria URL</label>
        <input
          id="memoria-base-url"
          name="memoriaBaseUrl"
          type="url"
          required
          placeholder="https://ashwannasleep.github.io/memoria/"
        />

        <label for="default-book-title">Default book title</label>
        <input id="default-book-title" name="defaultBookTitle" type="text" required />

        <label for="default-book-author">Default author</label>
        <input id="default-book-author" name="defaultBookAuthor" type="text" required />

        <label for="default-book-category">Default category</label>
        <input id="default-book-category" name="defaultBookCategory" type="text" required />

        <div class="actions">
          <button id="save-settings" type="submit">Save Settings</button>
          <button id="open-memoria" type="button">Open Memoria</button>
        </div>
      </form>

      <p class="hint">Usage: highlight text on any page, right click, then click "Save selection to Memoria".</p>
      <p id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
